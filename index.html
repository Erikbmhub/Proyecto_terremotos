<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="style.css" />

    <title>Web terremotos</title>
  </head>
  <body>
    <!-- Cabecera principal de la aplicación -->
    <header class="site-header">
      <div class="header-content">
        <p class="brand">SEISMIC MONITOR</p>
        <h1>Monitor de terremotos</h1>
        <p class="header-subtitle">Seguimiento de actividad sísmica mundial</p>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="container">
      <section class="map-card map-current">
        <h2>Mapa de terremotos actual</h2>
        <div id="map"></div>
      </section>

      <section class="filter-card">
        <form id="form-filtros">
          <h2>Filtrar terremotos</h2>

          <!-- Filtros de magnitud -->
          <div class="filter-group filter-magnitude">
            <h3>Magnitud</h3>

            <label for="magnitud">Magnitud mínima:</label>
            <input
              type="number"
              id="magnitud"
              name="magnitud"
              placeholder="Ej. 2.5"
              step="0.1"
            />

            <label for="magnitud-max">Magnitud máxima:</label>
            <input
              type="number"
              id="magnitud-max"
              name="magnitud-max"
              placeholder="Ej. 5"
              step="0.1"
            />
          </div>
          <!-- Filtros de fechas -->
          <div class="filter-group filter-dates">
            <h3>Periodo de búsqueda</h3>

            <label for="fecha-inicio">Fecha inicial:</label>
            <input type="date" id="fecha-inicio" name="fecha-inicio" />

            <label for="fecha-fin">Fecha final:</label>
            <input type="date" id="fecha-fin" name="fecha-fin" />
          </div>
          <button type="button" id="submit" class="filter-button">
            Buscar terremotos
          </button>
          <div id="spinner" class="loading-container" hidden>
            <div class="spinner"></div>
            <img
              src="https://media2.giphy.com/media/e6tJpLvjY8jXa/giphy.gif"
              alt="Rick y Morty bailando mientras se buscan terremotos"
            />
            <p>Buscando terremotos...</p>
          </div>
        </form>
      </section>
      <section class="map-card map-results">
        <h2>Mapa de terremotos por coordenadas, fecha y magnitud</h2>
        <div id="map2"></div>
      </section>
    </main>
  </body>
</html>
