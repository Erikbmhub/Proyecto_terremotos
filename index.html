<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="style.css" />

    <title>Web terremotos</title>
  </head>
  <body>

    <main>
      <h2>Mapa de terremotos actual</h2>
      <p id="message"></p>
      <div id="map"></div>
       <h2>Mapa de terremotos por coordenadas, fecha y magnitud</h2>
          <section class="boxfilter">
      <h2>Filtros por Magnitud</h2>
      <label for="magnitud">Magintud minima:</label><br />
      <input
        type="number"
        id="magnitud"
        name="magnitud"
        placeholder=" Ej. 2.5 "
        step="0.1"
      /><br />
      <label for="magnitud-max">Magnitud máxima:</label>
      <input
        type="number"
        id="magnitud-max"
        name="magnitud-max"
        placeholder="Ej. 5"
        step="0.1"
      />
      <h2>Filtro por fechas</h2>
      <label for="fecha-inicio">Fecha inicio:</label><br />
      <input type="date" id="fecha-inicio" name="fecha-inicio" /><br />
      <label for="fecha-fin">Fecha inicio:</label><br />
      <input type="date" id="fecha-fin" name="fecha-fin" /><br />
      <label for="envio">Enviar:</label><br />
      <input type="submit" id="submit" value="Buscar" /><br />
    </section>

     
      <div id="map2"></div>
    </main>
  </body>
</html>
